# Deploy: Nginx + PHP-FPM (Laravel) + PostgreSQL 17
#
# Satu server bisa menjalankan staging & production: clone ke 2 folder berbeda, lalu
# di masing-masing folder buat file ".env" (dibaca docker compose, bukan Laravel):
#
#   COMPOSE_PROJECT_NAME=apotek-staging     # nama unik -> container & volume terpisah
#   ENV_FILE=.env.staging                   # konfigurasi aplikasi + kata sandi
#   APP_PORT=8081                           # port lokal, di-proxy oleh aaPanel
#
# Jalankan: docker compose up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Port database sengaja tidak dibuka ke luar host

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    # Hanya bisa diakses dari server itu sendiri; publik masuk lewat reverse proxy aaPanel
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      - app

volumes:
  pgdata:
  storage:
